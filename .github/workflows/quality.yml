name: Validaciones de BookFit

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-description:
    name: Rellenar descripción del PR
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Rellenar descripción del PR
        uses: actions/github-script@v7
        with:
          script: |
            const body = (context.payload.pull_request.body ?? "")
              .replace(/<!--[\s\S]*?(?:-->|$)/g, "");
            const sections = body.split(/^##\s+/m);
            const description = sections.find((section, index) =>
              index > 0 && /^Descripción[ \t]*\r?\n/i.test(section)
            );
            const content = description?.replace(/^[^\n]*\n/, "") ?? "";
            const text = content.split(/\r?\n/)
              .filter((line) => !/^\s*#/.test(line))
              .map((line) => line.replace(/^\s*[-*+]\s*\[[ xX]\]\s*/, ""))
              .join(" ");
            if (!/[\p{L}\p{N}]/u.test(text)) {
              core.setFailed("Rellena la sección «Descripción» del PR con un resumen de los cambios.");
            }

  project-checks:
    name: Migraciones, tipos y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Start isolated local Supabase
        run: |
          log_file="$RUNNER_TEMP/bookfit-supabase-start.log"
          if ! pnpm local:start >"$log_file" 2>&1; then
            sed -E \
              -e 's#(postgres(ql)?://)[^[:space:]]+#\1[REDACTED]#g' \
              -e 's/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/[JWT_REDACTED]/g' \
              -e 's/sb_(publishable|secret)_[A-Za-z0-9_-]+/[SUPABASE_KEY_REDACTED]/Ig' \
              -e 's/((KEY|PASSWORD|SECRET|TOKEN)=)[^[:space:]]+/\1[REDACTED]/Ig' \
              "$log_file" | tail -n 60
            exit 1
          fi

      - name: Reset local database from migrations and seeds
        run: |
          log_file="$RUNNER_TEMP/bookfit-db-reset.log"
          if ! pnpm exec supabase db reset --local >"$log_file" 2>&1; then
            sed -E \
              -e 's#(postgres(ql)?://)[^[:space:]]+#\1[REDACTED]#g' \
              -e 's/eyJ[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+\.[A-Za-z0-9_-]+/[JWT_REDACTED]/g' \
              -e 's/sb_(publishable|secret)_[A-Za-z0-9_-]+/[SUPABASE_KEY_REDACTED]/Ig' \
              -e 's/((KEY|PASSWORD|SECRET|TOKEN)=)[^[:space:]]+/\1[REDACTED]/Ig' \
              "$log_file" | tail -n 80
            exit 1
          fi

      - name: Configure local runtime credentials
        run: pnpm local:env

      - name: Generate Supabase types from the local database
        run: pnpm supabase:types

      - name: Comprobar tipos de Supabase versionados
        run: |
          if ! git diff --exit-code -- src/types/database.types.ts; then
            echo "::error title=Tipos de Supabase desactualizados::Aplica las migraciones en Supabase local, ejecuta pnpm supabase:types y sube src/types/database.types.ts."
            exit 1
          fi

      - name: Run repository-wide quality checks
        run: pnpm quality:check

  quality:
    name: quality
    if: always()
    needs: [pr-description, project-checks]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirmar las validaciones requeridas para el merge
        env:
          DESCRIPTION_RESULT: ${{ needs.pr-description.result }}
          PROJECT_RESULT: ${{ needs.project-checks.result }}
        run: |
          failed=0
          if [ "$GITHUB_EVENT_NAME" = pull_request ] && [ "$DESCRIPTION_RESULT" != success ]; then
            echo "::error title=Descripción del PR::Revisa el resultado de Rellenar descripción del PR."
            failed=1
          fi
          if [ "$PROJECT_RESULT" != success ]; then
            echo "::error title=Validaciones del proyecto::Revisa el resultado de Migraciones, tipos y pruebas."
            failed=1
          fi
          exit "$failed"
