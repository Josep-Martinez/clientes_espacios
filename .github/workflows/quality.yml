name: BookFit quality gate

on:
  pull_request:
  push:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_TELEMETRY_DISABLED: "1"
      BOOKFIT_REQUIRE_INTEGRATION: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies from lockfile
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Install PostgreSQL client for local runtime role setup
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client

      - name: Start isolated local Supabase
        run: |
          log_file="$RUNNER_TEMP/bookfit-supabase-start.log"
          if ! pnpm local:start >"$log_file" 2>&1; then
            sed -E \
              -e 's#(postgres(ql)?://)[^[:space:]]+#\1[REDACTED]#g' \
              -e 's/((KEY|PASSWORD|SECRET|TOKEN)=)[^[:space:]]+/\1[REDACTED]/Ig' \
              "$log_file" | tail -n 60
            exit 1
          fi

      - name: Reset local database from migrations and seeds
        run: |
          log_file="$RUNNER_TEMP/bookfit-db-reset.log"
          if ! pnpm exec supabase db reset --local >"$log_file" 2>&1; then
            sed -E \
              -e 's#(postgres(ql)?://)[^[:space:]]+#\1[REDACTED]#g' \
              -e 's/((KEY|PASSWORD|SECRET|TOKEN)=)[^[:space:]]+/\1[REDACTED]/Ig' \
              "$log_file" | tail -n 80
            exit 1
          fi

      - name: Configure local runtime credentials
        run: pnpm local:env

      - name: Generate Supabase types from the local database
        run: pnpm supabase:types

      - name: Verify generated types are committed
        run: git diff --exit-code -- src/types/database.types.ts

      - name: Run repository-wide quality checks
        run: pnpm quality:check

      - name: Stop local Supabase
        if: always()
        run: |
          pnpm exec supabase stop --no-backup >/dev/null 2>&1 || true
